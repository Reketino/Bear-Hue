name: PR Summary

on:
    pull_request:
        types: [opened, synchronize]

permissions: 
    pull-requests: write

jobs: 
    update-pr:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4 

            - name: Generate PR title and body
              uses: actions/github-script@v7
              with:
                script: |
                    const fs = require("fs");
                    
                    const owner = context.repo.owner;
                    const repo = context.repo.repo;
                    const pull_number = context.payload.pull_request.number;

                    const labels = JSON.parse(
                        fs.readFileSync(".github/config/labels.json", "utf8")
                    );
                    const types = labels.map(label => label.name);
                    const regex = new RegExp(
                        `^(${types.join("|")})(\\([^)]+\\))?: .+`
                    );

                    const commits = await github.rest.pulls.listCommits({
                        owner,
                        repo,
                        pull_number
                    });

                    const messages = commits.data
                        .map(commit => commit.commit.message.split("\n")[0])
                        .filter(message => regex.test(message));

                    if (messages.length === 0) {
                        console.log("No valid commits found.");
                        return;
                    }
                    
                    const priorities = Object.fromEntries(
                        labels.map(label => [label.name, label.priority])
                    );

                    const emojis = Object.fromEntries(
                        labels.map(label => [label.name, label.emoji])
                    );

                    messages.sort((a, b) => {
                        const typeA = a.match(/^(\w+)/)?.[1] ?? "";
                        const typeB = b.match(/^(\w+)/)?.[1] ?? "";

                        return (
                            (priorities[typeA] ?? 999) - 
                            (priorities[typeB] ?? 999) 
                        );
                    });
                    
                    const title = messages[0];

                    const primaryType = title.match(/^(\w+)/)?.[1] ?? "";

                    const primaryLabel = labels.find(
                        label => label.name === primaryType
                    );

                    const commitSection = [
                        "## 📋 Commits Included",
                        "",
                        ...messages.map(message => {
                            const type = message.match(/^(\w+)/)?.[1] ?? "";
                            const emoji = emojis[type] ?? "🔹";

                            return `- ${emoji} ${message}`;
                        })
                    ].join("\n");

                    const pullRequest = await github.rest.pulls.get({
                        owner,
                        repo,
                        pull_number
                    });

                    const existingBody = pullRequest.data.body ?? "";

                    const sectionRegex = /## 📋 Commits Included[\s\S]*?(?=\n---|\n## |$)/;

                    let body;

                    if (sectionRegex.test(existingBody)) {
                        body = existingBody.replace(
                            sectionRegex,
                            commitSection
                      );
                    } else {
                      body = [
                            commitSection,
                            "",
                            "---",
                            "",
                            existingBody
                      ].join("\n");
                    }

                    await github.rest.pulls.update({
                        owner,
                        repo,
                        pull_number,
                        title,
                        body,
                    });

                    if (primaryLabel) {
                        const existingLabels = pullRequest.data.labels.map(
                            label => label.name
                        );
                        
                        const typeLabels = labels.map(
                            label => label.name
                        );

                        const preservedLabels = existingLabels.filter(
                            label => !typeLabels.includes(label)
                        );

                        await github.rest.issues.setLabels({
                            owner,
                            repo,
                            issue_number: pull_number,
                            labels: [
                                ...preservedLabels,
                                primaryLabel.name
                            ]
                        });
                    }

                    console.log(`Updated PR #${pull_number}`);
